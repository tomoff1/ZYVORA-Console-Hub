name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test protocols
        shell: pwsh
        run: |
          dotnet restore tests/Zyvora.Tests/Zyvora.Tests.csproj --configfile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          dotnet run --project tests/Zyvora.Tests/Zyvora.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
      - name: Build standalone distributions
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Validate installer archive
        shell: pwsh
        run: |
          $p = Start-Process dist/setup/ZYVORA-Setup.exe -ArgumentList '--verify-payload' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer integrity failure' }
      - uses: actions/upload-artifact@v4
        with:
          name: ZYVORA-windows
          path: |
            dist/ZYVORA-*.exe
            dist/ZYVORA-*.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Existing release retained'; exit 0 }
          gh release create $env:GITHUB_REF_NAME dist/ZYVORA-*.exe dist/ZYVORA-*.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "ZYVORA $env:GITHUB_REF_NAME" --prerelease --notes-file docs/RELEASE-NOTES.md
